{
  "services": {
    "api": {
      "build": {
        "context": ".",
        "dockerfile": "docker/api.Dockerfile"
      },
      "ports": [
        "127.0.0.1:${API_PORT:-8000}:8000"
      ],
      "volumes": [
        "metadata:/var/lib/lps"
      ],
      "environment": {
        "LPS_METADATA_PATH": "/var/lib/lps/metadata.sqlite3"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "10s"
      },
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "frontend": {
      "build": {
        "context": "./frontend"
      },
      "ports": [
        "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
      ],
      "depends_on": {
        "api": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/api/v1/health"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "10s"
      },
      "security_opt": [
        "no-new-privileges:true"
      ]
    }
  },
  "volumes": {
    "metadata": {}
  }
}
