{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "github-actions",
      "directory": "/",
      "schedule": {
        "interval": "monthly"
      },
      "groups": {
        "github-actions": {
          "patterns": ["*"]
        }
      },
      "open-pull-requests-limit": 5
    },
    {
      "package-ecosystem": "pip",
      "directory": "/",
      "schedule": {
        "interval": "monthly"
      },
      "groups": {
        "python": {
          "patterns": ["*"]
        }
      },
      "open-pull-requests-limit": 5
    },
    {
      "package-ecosystem": "npm",
      "directory": "/frontend",
      "schedule": {
        "interval": "monthly"
      },
      "groups": {
        "frontend": {
          "patterns": ["*"]
        }
      },
      "open-pull-requests-limit": 5
    }
  ]
}
