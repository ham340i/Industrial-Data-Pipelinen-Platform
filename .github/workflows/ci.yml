{
  "name": "CI",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "check": {
      "name": "Repository checks",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Check repository configuration, syntax and hygiene",
          "run": "python3 scripts/check_repository.py"
        },
        {
          "name": "Validate Release 1 ownership, estimates and dependencies",
          "run": "python3 scripts/check_release_plan.py"
        },
        {
          "name": "Test repository tools",
          "run": "python3 -m unittest discover -s scripts/tests -v"
        }
      ]
    },
    "backend": {
      "name": "Backend checks",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.12",
            "cache": "pip",
            "cache-dependency-path": "requirements.lock"
          }
        },
        {
          "name": "Install locked dependencies",
          "run": "python -m pip install --require-hashes -r requirements.lock"
        },
        {
          "name": "Lint with Ruff",
          "run": "python -m ruff check"
        },
        {
          "name": "Check formatting with Ruff",
          "run": "python -m ruff format --check"
        },
        {
          "name": "Type-check with mypy",
          "run": "python -m mypy"
        },
        {
          "name": "Run API tests with pytest",
          "run": "python -m pytest"
        }
      ]
    },
    "frontend": {
      "name": "Frontend checks",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "defaults": {
        "run": {
          "working-directory": "frontend"
        }
      },
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24",
            "cache": "npm",
            "cache-dependency-path": "frontend/package-lock.json"
          }
        },
        {
          "name": "Install locked dependencies",
          "run": "npm ci --ignore-scripts"
        },
        {
          "name": "Lint, format, typecheck, test and build",
          "run": "npm run check"
        },
        {
          "name": "Install Chromium for shell smoke tests",
          "run": "npm run browser:install -- --with-deps"
        },
        {
          "name": "Verify production shell in Chromium",
          "run": "npm run test:browser"
        }
      ]
    }
  }
}
